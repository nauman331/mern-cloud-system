version: '3.8'
services:
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_KEY=${JWT_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AWS_REGION=${AWS_REGION}
      - SNS_ENDPOINT=${SNS_ENDPOINT}
      - SNS_AUTH_TOPIC_ARN=${SNS_AUTH_TOPIC_ARN}
    depends_on:
      - mongodb
      - redis
      - localstack

  payment-service: # Fixed Indentation
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/payments 
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - AWS_REGION=${AWS_REGION}
      - SNS_ENDPOINT=${SNS_ENDPOINT}
      - SNS_ORDER_TOPIC_ARN=${SNS_ORDER_TOPIC_ARN}
    depends_on: # Added dependency
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs,s3
      - DEBUG=1